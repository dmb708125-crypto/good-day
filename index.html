<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хорошего дня!</title>

<!-- Шрифты с кириллицей: Unbounded — заголовок, Caveat — рукописная приписка, Rubik — мелкий текст -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Rubik:wght@500;700&family=Unbounded:wght@800&display=swap">

<style>
  /* ---------- Палитра (светлая тема — базовая) ----------
     Все цвета объявлены здесь, а блок тёмной темы ниже только переопределяет значения. */
  :root {
    --bg:      #FFF3D6;  /* фон страницы */
    --rays:    #FFE39A;  /* цвет расходящихся лучей */
    --ink:     #2A1F2D;  /* основной тёмный цвет: текст и обводка фото */
    --sticker: #FFF9EF;  /* кремовая подложка круга */
    --muted:   #6B5F52;  /* приглушённый текст приписки */
  }

  /* Тёмная тема телефона */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:    #241C2E;
      --rays:  #342640;
      --ink:   #FFF0D6;
      --muted: #BCA9C4;
      /* --sticker намеренно остаётся светлым: фото всегда на кремовом круге */
    }
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);           /* фон задан явно */
    color: var(--ink);
    font-family: "Rubik", system-ui, sans-serif;
    overflow-x: hidden;              /* страница не едет вбок на узких экранах */
  }

  /* Расходящиеся лучи на фоне — рисуются градиентом, медленно вращаются */
  .rays {
    position: fixed;
    inset: -30vmax;                  /* с запасом за края, чтобы при вращении не появлялись углы */
    z-index: 0;
    background: repeating-conic-gradient(
      from 0deg,
      var(--rays) 0deg 9deg,
      transparent 9deg 18deg
    );
    /* затухание к краям, чтобы лучи не спорили с текстом */
    -webkit-mask-image: radial-gradient(circle at center, #000 25%, transparent 70%);
            mask-image: radial-gradient(circle at center, #000 25%, transparent 70%);
    animation: spin 90s linear infinite;
  }

  /* Контентная колонка. Боковой отступ 16px задан один раз здесь. */
  .scene {
    position: relative;
    z-index: 1;
    min-height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 32px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
  }

  /* Круглая наклейка с фотографией */
  .sticker {
    position: relative;
    width: min(78vw, 330px);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 50%;
    background: var(--sticker);
    border: 7px solid var(--ink);
    box-shadow: 0 14px 0 -2px rgba(42, 31, 45, .25);
    overflow: hidden;                /* фото обрезается по кругу */
    animation: pop .5s cubic-bezier(.34, 1.56, .64, 1) both,
               sway 4s 1s ease-in-out infinite;   /* лёгкое покачивание после появления */
  }
  .sticker img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    object-fit: cover;               /* фото заполняет круг без искажений */
    display: block;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 9.5vw, 54px);
    line-height: 1.05;
    text-wrap: balance;
    animation: pop .5s .2s cubic-bezier(.34, 1.56, .64, 1) both;
  }

  .note {
    margin: 0;
    font-family: "Caveat", cursive;
    font-size: clamp(20px, 5.5vw, 27px);
    color: var(--muted);
    animation: pop .5s .45s cubic-bezier(.34, 1.56, .64, 1) both;
  }

  /* --- Анимации --- */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop  { from { opacity: 0; transform: scale(.7); } to { opacity: 1; } }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50%      { transform: rotate(1.5deg); }
  }

  /* Уважаем системную настройку «уменьшить движение» */
  @media (prefers-reduced-motion: reduce) {
    .rays, .sticker, h1, .note { animation: none !important; }
  }
</style>
</head>
